name: full_recovery
description: >
  Full sweep: every declared fault type against a fixed question subset, with
  three repetitions to expose variance. This is the table quoted in the report.
seed: 42
repetitions: 3
dataset: demo
question_ids: [q001, q005, q010, q016, q019, q022]
modes:
  - mode1_normal_rag
  - mode2_agentic_no_recovery
  - mode3_agentic_with_recovery
fault_sweep:
  - BAD_QUERY_REWRITE
  - LOW_TOP_K
  - RANKING_CORRUPTION
  - CHUNK_FRAGMENTATION
  - CONTEXT_TRUNCATION
  - CONFLICTING_EVIDENCE
  - GENERATION_CONSTRAINT_REMOVAL
  - STALE_DOCUMENT
  - AMBIGUOUS_QUERY
  - RETRIEVAL_TIMEOUT
  - EMPTY_RETRIEVAL
  - EMBEDDING_FAILURE
  - MODEL_FAILURE
  - QUERY_CORRUPTION
  - IRRELEVANT_DOC_INJECTION
  - RELEVANT_DOC_REMOVAL
  - INCOMPLETE_DECOMPOSITION
