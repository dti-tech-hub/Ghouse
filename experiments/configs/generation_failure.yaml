name: generation_failure
description: >
  The grounding constraint is removed from the generation prompt, so the model
  produces unsupported claims. The CONSTRAINED_REGENERATION recovery
  regenerates from the same retrieved context under restored constraints.
seed: 42
repetitions: 1
dataset: demo
fault_type: GENERATION_CONSTRAINT_REMOVAL
question_ids: [q001, q006, q013, q014, q016, q022]
modes:
  - mode1_normal_rag
  - mode2_agentic_no_recovery
  - mode3_agentic_with_recovery
