name: ranking_failure
description: >
  The reranker is replaced by one that reverses the candidate order, so
  retrieval finds the evidence and ranking loses it. The RERANK recovery
  re-orders the cached candidate pool without repeating retrieval.
seed: 42
repetitions: 1
dataset: demo
fault_type: RANKING_CORRUPTION
question_ids: [q001, q002, q005, q008, q016, q019]
modes:
  - mode1_normal_rag
  - mode2_agentic_no_recovery
  - mode3_agentic_with_recovery
