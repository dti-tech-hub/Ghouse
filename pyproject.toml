[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-recovery"
version = "1.0.0"
description = "Agentic RAG Failure Diagnosis and Recovery System (B.Tech final-year project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "streamlit>=1.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
retrieval = ["faiss-cpu>=1.7", "rank-bm25>=0.2"]
documents = ["pypdf>=4.0", "python-docx>=1.1"]
embeddings = ["sentence-transformers>=2.5"]
agent = ["langgraph>=0.1"]
evaluation = ["ragas>=0.1", "deepeval>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = [
    "faiss-cpu>=1.7",
    "rank-bm25>=0.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "langgraph>=0.1",
]

[tool.setuptools.packages.find]
include = ["agentic_rag_recovery*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --disable-warnings"
markers = [
    "slow: long running tests",
    "integration: requires index or api",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["agentic_rag_recovery"]
omit = ["*/tests/*", "*/dashboard/*"]